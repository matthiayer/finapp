name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Require release commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: go test ./...
      - run: go vet ./...
      - name: Build Linux AMD64 release package
        run: |
          mkdir -p dist/package
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o dist/package/finapp ./cmd/finapp
          cp deploy/finapp.service deploy/finapp.env.example dist/package/
          tar -czf "dist/finapp-${GITHUB_REF_NAME}-linux-amd64.tar.gz" \
            -C dist/package .
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" \
          "dist/finapp-${GITHUB_REF_NAME}-linux-amd64.tar.gz" \
          --generate-notes
